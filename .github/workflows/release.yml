name: Release InkNote

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to build or repair"
        required: true
        default: "v0.2.5"
      platforms:
        description: "Platform group to build"
        required: true
        type: choice
        default: "linux"
        options:
          - linux
          - desktop
          - all
          - manifest
  push:
    tags:
      - "v*"

jobs:
  publish:
    if: github.event_name == 'push' || inputs.platforms == 'desktop' || inputs.platforms == 'all'
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: ""
            args: "--bundles nsis"
            asset_pattern: "InkNote-Windows-x64-Setup[ext]"
          - platform: macos-latest
            target: x86_64-apple-darwin
            args: "--target x86_64-apple-darwin --bundles app,dmg"
            asset_pattern: "InkNote-macOS-x86_64[ext]"
          - platform: macos-latest
            target: aarch64-apple-darwin
            args: "--target aarch64-apple-darwin --bundles app,dmg"
            asset_pattern: "InkNote-macOS-arm64[ext]"
    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm
          cache-dependency-path: InkNote/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable
        if: matrix.target == ''

      - uses: dtolnay/rust-toolchain@stable
        if: matrix.target != ''
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: InkNote/src-tauri -> target

      - name: Install dependencies
        working-directory: InkNote
        run: pnpm install --frozen-lockfile

      - name: Run tests
        working-directory: InkNote
        run: pnpm test

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          projectPath: InkNote
          tagName: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          releaseName: "InkNote v__VERSION__"
          releaseBody: |
            InkNote v__VERSION__

            ### 修复与改进

            - 文件保存、覆盖、复制和跨磁盘移动改为安全的原子写入，失败时保留原文件
            - 新建与重命名增加跨平台文件名校验，阻止路径穿越及 Windows 非法名称
            - 正则搜索改用线性时间引擎，避免复杂表达式导致界面卡死
            - 图片附件改为随文档事务提交，修复重名、孤立文件和保存失败后的断图问题
            - 修复图片保存后预览地址未及时切换的问题
            - 修复窗口关闭监听重复注册及异步监听泄漏

            ### 平台说明

            - Windows、macOS 和 Linux AppImage 支持应用内自动更新
            - Linux DEB / RPM 用户会收到新版本提示，请继续使用系统包管理器升级

            ### 下载

            - Windows x64：中文安装程序
            - macOS Intel：x86_64 DMG
            - macOS Apple 芯片：ARM64 DMG
            - Linux x86_64：AppImage / DEB / RPM
            - Linux ARM64：AppImage / DEB / RPM

            macOS 安装包使用 ad-hoc 签名且未经过 Apple 公证。若首次打开被 Gatekeeper 拦截，请在“系统设置 → 隐私与安全性”中选择“仍要打开”。
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: false
          retryAttempts: 2
          releaseAssetNamePattern: ${{ matrix.asset_pattern }}
          args: ${{ matrix.args }}

  publish-linux:
    if: github.event_name == 'push' || inputs.platforms == 'linux' || inputs.platforms == 'all'
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            architecture: x86_64
            asset_pattern: "InkNote-Linux-x86_64[ext]"
          - platform: ubuntu-24.04-arm
            architecture: arm64
            asset_pattern: "InkNote-Linux-arm64[ext]"
    runs-on: ${{ matrix.platform }}
    env:
      APPIMAGE_EXTRACT_AND_RUN: "1"

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm
          cache-dependency-path: InkNote/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: InkNote/src-tauri -> target

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            rpm \
            wget \
            xdg-utils

      - name: Install dependencies
        working-directory: InkNote
        run: pnpm install --frozen-lockfile

      - name: Run tests
        working-directory: InkNote
        run: pnpm test

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          projectPath: InkNote
          tagName: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          releaseName: "InkNote v__VERSION__"
          releaseBody: |
            InkNote v__VERSION__

            ### 修复与改进

            - 文件保存、覆盖、复制和跨磁盘移动改为安全的原子写入，失败时保留原文件
            - 新建与重命名增加跨平台文件名校验，阻止路径穿越及 Windows 非法名称
            - 正则搜索改用线性时间引擎，避免复杂表达式导致界面卡死
            - 图片附件改为随文档事务提交，修复重名、孤立文件和保存失败后的断图问题
            - 修复图片保存后预览地址未及时切换的问题
            - 修复窗口关闭监听重复注册及异步监听泄漏

            ### 平台说明

            - Windows、macOS 和 Linux AppImage 支持应用内自动更新
            - Linux DEB / RPM 用户会收到新版本提示，请继续使用系统包管理器升级

            ### 下载

            - Windows x64：中文安装程序
            - macOS Intel：x86_64 DMG
            - macOS Apple 芯片：ARM64 DMG
            - Linux x86_64：AppImage / DEB / RPM
            - Linux ARM64：AppImage / DEB / RPM

            Linux 用户可根据发行版选择 AppImage、DEB 或 RPM。macOS 安装包使用 ad-hoc 签名且未经过 Apple 公证。
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: false
          retryAttempts: 2
          releaseAssetNamePattern: ${{ matrix.asset_pattern }}
          args: "--bundles deb,rpm,appimage"

  publish-updater-manifest:
    name: Publish updater manifest
    needs: [publish, publish-linux]
    if: |
      always() &&
      (
        inputs.platforms == 'manifest' ||
        (
          (needs.publish.result == 'success' || needs.publish.result == 'skipped') &&
          (needs.publish-linux.result == 'success' || needs.publish-linux.result == 'skipped') &&
          !(needs.publish.result == 'skipped' && needs.publish-linux.result == 'skipped')
        )
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7

      - name: Build latest.json from all platform assets
        shell: bash
        run: |
          set -euo pipefail

          version="$(jq -r '.version' InkNote/src-tauri/tauri.conf.json)"
          published_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          asset_names="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" --jq '.assets[].name')"

          pick_asset() {
            local pattern="$1"
            printf '%s\n' "$asset_names" | grep -E -- "$pattern" | head -n 1
          }

          read_signature() {
            local signature_name="${1}.sig"
            local asset_id
            asset_id="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" \
              --jq ".assets[] | select(.name == \"${signature_name}\") | .id")"
            if [[ -z "$asset_id" ]]; then
              echo "Missing updater signature: ${signature_name}" >&2
              exit 1
            fi
            gh api "repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}" \
              -H 'Accept: application/octet-stream'
          }

          windows_asset="$(pick_asset '^InkNote-Windows-x64-Setup\.exe$')"
          macos_x86_asset="$(pick_asset '^InkNote-macOS-x86_64\.app\.tar\.gz$')"
          macos_arm_asset="$(pick_asset '^InkNote-macOS-arm64\.app\.tar\.gz$')"
          for asset in "$windows_asset" "$macos_x86_asset" "$macos_arm_asset"; do
            if [[ -z "$asset" ]]; then
              echo "Missing one or more updater archives in release ${RELEASE_TAG}" >&2
              printf '%s\n' "$asset_names" >&2
              exit 1
            fi
          done

          windows_signature="$(read_signature "$windows_asset")"
          macos_x86_signature="$(read_signature "$macos_x86_asset")"
          macos_arm_signature="$(read_signature "$macos_arm_asset")"
          linux_x86_asset="$(pick_asset '^InkNote-Linux-x86_64\.AppImage$' || true)"
          linux_arm_asset="$(pick_asset '^InkNote-Linux-arm64\.AppImage$' || true)"
          linux_x86_signature=""
          linux_arm_signature=""
          if [[ -n "$linux_x86_asset" ]]; then
            linux_x86_signature="$(read_signature "$linux_x86_asset")"
          fi
          if [[ -n "$linux_arm_asset" ]]; then
            linux_arm_signature="$(read_signature "$linux_arm_asset")"
          fi
          base_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}"

          jq -n \
            --arg version "$version" \
            --arg notes "InkNote ${RELEASE_TAG}" \
            --arg pub_date "$published_at" \
            --arg windows_signature "$windows_signature" \
            --arg windows_url "${base_url}/${windows_asset}" \
            --arg macos_x86_signature "$macos_x86_signature" \
            --arg macos_x86_url "${base_url}/${macos_x86_asset}" \
            --arg macos_arm_signature "$macos_arm_signature" \
            --arg macos_arm_url "${base_url}/${macos_arm_asset}" \
            --arg linux_x86_signature "$linux_x86_signature" \
            --arg linux_x86_url "${linux_x86_asset:+${base_url}/${linux_x86_asset}}" \
            --arg linux_arm_signature "$linux_arm_signature" \
            --arg linux_arm_url "${linux_arm_asset:+${base_url}/${linux_arm_asset}}" \
            '{
              version: $version,
              notes: $notes,
              pub_date: $pub_date,
              platforms: ({
                "windows-x86_64": { signature: $windows_signature, url: $windows_url },
                "darwin-x86_64": { signature: $macos_x86_signature, url: $macos_x86_url },
                "darwin-aarch64": { signature: $macos_arm_signature, url: $macos_arm_url }
              } +
              (if $linux_x86_url != "" then {
                "linux-x86_64": { signature: $linux_x86_signature, url: $linux_x86_url }
              } else {} end) +
              (if $linux_arm_url != "" then {
                "linux-aarch64": { signature: $linux_arm_signature, url: $linux_arm_url }
              } else {} end))
            }' > latest.json

          gh release upload "$RELEASE_TAG" latest.json --clobber
