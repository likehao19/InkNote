name: Release InkNote

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to build or repair"
        required: true
        default: "v0.2.3"
  push:
    tags:
      - "v*"

jobs:
  publish:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: ""
            args: "--bundles nsis"
            asset_pattern: "InkNote-Windows-x64-Setup[ext]"
          - platform: macos-latest
            target: x86_64-apple-darwin
            args: "--target x86_64-apple-darwin --bundles app,dmg"
            asset_pattern: "InkNote-macOS-x86_64[ext]"
          - platform: macos-latest
            target: aarch64-apple-darwin
            args: "--target aarch64-apple-darwin --bundles app,dmg"
            asset_pattern: "InkNote-macOS-arm64[ext]"
    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm
          cache-dependency-path: InkNote/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable
        if: matrix.target == ''

      - uses: dtolnay/rust-toolchain@stable
        if: matrix.target != ''
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: InkNote/src-tauri -> target

      - name: Install dependencies
        working-directory: InkNote
        run: pnpm install --frozen-lockfile

      - name: Run tests
        working-directory: InkNote
        run: pnpm test

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          projectPath: InkNote
          tagName: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          releaseName: "InkNote v__VERSION__"
          releaseBody: |
            InkNote v__VERSION__

            ### 修复

            - 修复 macOS 应用未运行时，双击 Markdown 文件仍恢复上次文档、没有打开目标文件的问题（#1）
            - 修复 macOS 安装包签名结构不完整，可能被系统提示“文件已损坏”的问题
            - “预览 / 编辑”切换现在适用于新建文档、应用内打开的已有文件和外部关联打开的文件

            ### 下载

            - Windows x64：中文安装程序
            - macOS Intel：x86_64 DMG
            - macOS Apple 芯片：ARM64 DMG

            macOS 安装包使用 ad-hoc 签名且未经过 Apple 公证。若首次打开被 Gatekeeper 拦截，请在“系统设置 → 隐私与安全性”中选择“仍要打开”。
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: false
          retryAttempts: 2
          releaseAssetNamePattern: ${{ matrix.asset_pattern }}
          args: ${{ matrix.args }}

  publish-updater-manifest:
    name: Publish updater manifest
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7

      - name: Build latest.json from all platform assets
        shell: bash
        run: |
          set -euo pipefail

          version="$(jq -r '.version' InkNote/src-tauri/tauri.conf.json)"
          published_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          asset_names="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" --jq '.assets[].name')"

          pick_asset() {
            local pattern="$1"
            printf '%s\n' "$asset_names" | grep -E -- "$pattern" | head -n 1
          }

          read_signature() {
            local signature_name="${1}.sig"
            local asset_id
            asset_id="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" \
              --jq ".assets[] | select(.name == \"${signature_name}\") | .id")"
            if [[ -z "$asset_id" ]]; then
              echo "Missing updater signature: ${signature_name}" >&2
              exit 1
            fi
            gh api "repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}" \
              -H 'Accept: application/octet-stream'
          }

          windows_asset="$(pick_asset '^InkNote-Windows-x64-Setup\.exe$')"
          macos_x86_asset="$(pick_asset '^InkNote-macOS-x86_64\.app\.tar\.gz$')"
          macos_arm_asset="$(pick_asset '^InkNote-macOS-arm64\.app\.tar\.gz$')"
          for asset in "$windows_asset" "$macos_x86_asset" "$macos_arm_asset"; do
            if [[ -z "$asset" ]]; then
              echo "Missing one or more updater archives in release ${RELEASE_TAG}" >&2
              printf '%s\n' "$asset_names" >&2
              exit 1
            fi
          done

          windows_signature="$(read_signature "$windows_asset")"
          macos_x86_signature="$(read_signature "$macos_x86_asset")"
          macos_arm_signature="$(read_signature "$macos_arm_asset")"
          base_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}"

          jq -n \
            --arg version "$version" \
            --arg notes "InkNote ${RELEASE_TAG}" \
            --arg pub_date "$published_at" \
            --arg windows_signature "$windows_signature" \
            --arg windows_url "${base_url}/${windows_asset}" \
            --arg macos_x86_signature "$macos_x86_signature" \
            --arg macos_x86_url "${base_url}/${macos_x86_asset}" \
            --arg macos_arm_signature "$macos_arm_signature" \
            --arg macos_arm_url "${base_url}/${macos_arm_asset}" \
            '{
              version: $version,
              notes: $notes,
              pub_date: $pub_date,
              platforms: {
                "windows-x86_64": { signature: $windows_signature, url: $windows_url },
                "darwin-x86_64": { signature: $macos_x86_signature, url: $macos_x86_url },
                "darwin-aarch64": { signature: $macos_arm_signature, url: $macos_arm_url }
              }
            }' > latest.json

          gh release upload "$RELEASE_TAG" latest.json --clobber
