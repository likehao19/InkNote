<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title description">
  <title id="title">InkNote editor interface</title>
  <desc id="description">InkNote window with a file tree and a rendered Markdown document.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%"><feDropShadow dx="0" dy="20" stdDeviation="22" flood-color="#1d3552" flood-opacity=".16" /></filter>
  </defs>
  <rect width="1400" height="820" fill="#f4f7fa" />
  <g filter="url(#shadow)">
    <rect x="70" y="58" width="1260" height="704" rx="14" fill="#fff" stroke="#cbd5e1" />
    <path d="M70 106h1260" stroke="#dfe5ec" />
    <rect x="70" y="106" width="272" height="630" fill="#f7f8fa" />
    <path d="M342 106v630" stroke="#dfe5ec" />
    <rect x="70" y="736" width="1260" height="26" rx="0 0 14 14" fill="#1769c2" />
  </g>
  <g font-family="Segoe UI, Noto Sans SC, sans-serif">
    <text x="101" y="89" fill="#142033" font-size="15" font-weight="600">InkNote</text>
    <text x="700" y="88" text-anchor="middle" fill="#718096" font-size="13">project-notes.md</text>
    <g fill="none" stroke="#8b98a8"><circle cx="1251" cy="82" r="5" /><circle cx="1276" cy="82" r="5" /><circle cx="1301" cy="82" r="5" /></g>
    <g font-size="13" text-anchor="middle"><text x="116" y="137" fill="#142033" font-weight="700">文件</text><text x="205" y="137" fill="#6c788a">大纲</text><text x="294" y="137" fill="#6c788a">最近</text></g>
    <path d="M75 153h82" stroke="#1769c2" stroke-width="3" />
    <rect x="88" y="172" width="236" height="34" rx="5" fill="#fff" stroke="#dbe2ea" />
    <text x="101" y="194" fill="#8a97a8" font-size="12">筛选文件…</text>
    <g fill="#526278" font-size="13"><text x="98" y="236" fill="#142033" font-weight="700">⌄  InkNote Docs</text><text x="112" y="270">⌄  guide</text><rect x="102" y="285" width="222" height="32" rx="5" fill="#e7f0fa" /><text x="132" y="306" fill="#1769c2">quick-start.md</text><text x="132" y="342">shortcuts.md</text><text x="112" y="378">release-notes.md</text></g>
    <g transform="translate(430 170)">
      <text x="0" y="32" fill="#a7b3c0" font-size="26">##</text><text x="45" y="34" fill="#142033" font-family="Georgia, serif" font-size="38" font-weight="700">InkNote</text>
      <text x="0" y="88" fill="#405066" font-size="17">专注于内容的本地 Markdown 编辑器。</text>
      <path d="M2 127v78" stroke="#bcc8d5" stroke-width="4" />
      <text x="25" y="151" fill="#25364b" font-size="17" font-weight="700">所见即所得</text><text x="25" y="184" fill="#617084" font-size="15">编辑时显示语法，完成后恢复清晰排版。</text>
      <text x="0" y="257" fill="#142033" font-family="Georgia, serif" font-size="26" font-weight="700">核心能力</text>
      <g fill="#34445a" font-size="15"><circle cx="6" cy="304" r="3" /><text x="22" y="310">表格与任务列表</text><circle cx="6" cy="341" r="3" /><text x="22" y="347">数学公式与图表</text></g>
      <rect x="375" y="279" width="434" height="120" rx="8" fill="#f5f7f9" stroke="#d7e0e9" />
      <text x="393" y="302" fill="#7c8a9b" font-size="10">TYPESCRIPT</text>
      <g font-family="Consolas, monospace" font-size="13"><text x="393" y="332" fill="#a4afbb">1</text><text x="421" y="332" fill="#26384e">const note = "InkNote";</text><text x="393" y="359" fill="#a4afbb">2</text><text x="421" y="359" fill="#26384e">save(note);</text><text x="393" y="386" fill="#a4afbb">3</text><text x="421" y="386" fill="#6b7d91">// local first</text></g>
      <g transform="translate(0 438)" font-size="14"><rect width="809" height="118" fill="#fff" stroke="#d4dde7" /><rect width="809" height="38" fill="#f6f8fa" /><path d="M0 38h809M0 78h809M540 0v118" stroke="#d4dde7" /><text x="16" y="25" fill="#142033" font-weight="700">功能</text><text x="556" y="25" fill="#142033" font-weight="700">支持</text><text x="16" y="65" fill="#35465a">Markdown / GFM</text><text x="556" y="65" fill="#1769c2">✓</text><text x="16" y="105" fill="#35465a">KaTeX / Mermaid</text><text x="556" y="105" fill="#1769c2">✓</text></g>
    </g>
    <g fill="#fff" font-size="11"><text x="88" y="754">预览</text><text x="140" y="754">Ln 18</text><text x="191" y="754">128 words</text><text x="272" y="754">UTF-8</text></g>
  </g>
</svg>
